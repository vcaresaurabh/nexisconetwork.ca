<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Something went wrong — Nexisco Network</title>
  <style>
    :root { --accent:#0891B2; --accent2:#4F46E5; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#FAFBFC; color:#0F172A;
      font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      text-align:center; padding:2rem;
    }
    .wrap { max-width:560px; }
    .code {
      font-size:clamp(3.5rem,10vw,6rem); font-weight:800; line-height:1; margin:0 0 .5rem;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    h1 { font-size:1.5rem; margin:0 0 .75rem; }
    p { color:#64748B; line-height:1.6; margin:0 0 1.75rem; }
    .btns { display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap; }
    a.btn {
      display:inline-block; padding:.75rem 1.5rem; border-radius:9999px; text-decoration:none;
      font-weight:600; font-size:.95rem;
    }
    .primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
    .secondary { border:1px solid rgba(15,23,42,.15); color:#0F172A; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">500</div>
    <h1>Something went wrong on our end</h1>
    <p>We hit an unexpected error. Please try again in a moment. If it keeps happening,
       email <a href="mailto:support@nexisconetwork.ca">support@nexisconetwork.ca</a> and we'll sort it out.</p>
    <div class="btns">
      <a class="btn primary" href="/">Back to Home</a>
      <a class="btn secondary" href="/start-project">Get a Free Quote</a>
    </div>
  </div>
</body>
</html>
